<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0C10"/>
      <stop offset="1" stop-color="#14151C"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#24262F" stroke-width="1.5"/>

  <!-- prompt mark: ~/ echoing the site's nav logo, bold and simplified for small sizes -->
  <text x="32" y="43" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="800"
        font-size="34" text-anchor="middle" fill="#39FF6A">~/</text>
</svg>
